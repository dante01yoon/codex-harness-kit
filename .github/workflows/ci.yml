name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python -m unittest discover -s tests -v
      - name: preset examples
        run: |
          for preset in node python go generic; do
            d=$(mktemp -d) && git -C "$d" init -q
            python install.py "$d" --preset "$preset" --verify "true"
            (cd "$d" && python .codex/harness/harness.py test)
          done
